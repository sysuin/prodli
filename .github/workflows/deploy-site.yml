# Deploys prodli.com (marketing site + /extension live preview) to Cloudflare
# Pages — free (unlimited bandwidth for static sites, free SSL, custom domain).
#
# One-time setup (see docs/MOVING-OFF-REPLIT.md):
#   1. Create a Cloudflare Pages project named "prodli" (Direct Upload).
#   2. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until the secrets exist this workflow builds the site and skips the deploy.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "artifacts/prodli-site/**"
      - "artifacts/prodli/**"
      - "scripts/build-web.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-dist --project-name=prodli --branch=main
      - name: Skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::Website built but not deployed — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable."
