# Runs on pull requests and on pushes to main: type check, unit tests, extension
# build, and end-to-end tests in headless Chrome. The built extension zip is
# attached to each run (Actions → run → Artifacts), ready to upload to the
# Chrome Web Store.
#
# Minutes: GitHub Actions is free for public repos and includes 2,000 min/month
# for private ones; a run takes about 12 minutes. So that a push to a pull
# request branch runs CI once (not once for the push and again for the PR),
# branch pushes only run through their pull request; a newer push cancels the
# older run of the same PR; and changes to docs only don't run it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Phone app bundles (iOS + Android JavaScript, as the store builds make them)
        run: pnpm --filter @workspace/prodli-mobile run export:check
      - name: Desktop app (build, package for Linux, smoke-test the package)
        run: |
          pnpm --filter @workspace/prodli-desktop run build
          cd artifacts/prodli-desktop
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --linux dir --publish never
          xvfb-run --auto-servernum node tests/smoke.mjs release/linux-unpacked/prodli
      - run: pnpm run build:extension
        env:
          # Optional: enables "Sign in with Google" in the built zip (see docs/GOOGLE-SIGN-IN.md)
          PRODLI_GOOGLE_CLIENT_ID: ${{ secrets.PRODLI_GOOGLE_CLIENT_ID }}
          PRODLI_EXTENSION_KEY: ${{ secrets.PRODLI_EXTENSION_KEY }}
      - name: End-to-end tests (headless Chrome, separate test build without secrets)
        run: pnpm test:e2e
      - name: Accounts end-to-end (local prodli-api + extension + web app)
        run: pnpm test:e2e:server
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: prodli-extension
          path: prodli-extension.zip
          retention-days: 30
