# Runs on every push and pull request: type check, unit tests, extension build,
# and end-to-end tests in headless Chrome. The built extension zip is attached
# to each run (Actions → run → Artifacts), ready to upload to the Chrome Web Store.
# Free: GitHub Actions is free for public repos and includes 2,000 min/month for private ones.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build:extension
        env:
          # Optional: enables "Sign in with Google" in the built zip (see docs/GOOGLE-SIGN-IN.md)
          PRODLI_GOOGLE_CLIENT_ID: ${{ secrets.PRODLI_GOOGLE_CLIENT_ID }}
          PRODLI_EXTENSION_KEY: ${{ secrets.PRODLI_EXTENSION_KEY }}
      - name: End-to-end tests (headless Chrome, separate test build without secrets)
        run: pnpm test:e2e
      - name: Accounts end-to-end (local prodli-api + extension + web app)
        run: pnpm test:e2e:server
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: prodli-extension
          path: prodli-extension.zip
          retention-days: 30
