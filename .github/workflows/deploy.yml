# Deploys ProdLi to Cloudflare (account of the CLOUDFLARE_ACCOUNT_ID secret).
#
#   push to main    → prodli.com (website) + prodli-api-staging
#   manual run      → choose what to deploy, including the production API
#                     (app.prodli.com: saves a D1 restore point first, then
#                     deploys and checks /api/health; the restore command is
#                     in the run's summary). This is how production is
#                     deployed, so no laptop or cloud session holds the token.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (token permissions: docs/CLOUDFLARE.md). Until they exist, jobs build and
# test but skip the deploy.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "scripts/build-web.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: site-and-staging
        options: [site-and-staging, production-api]

concurrency:
  group: deploy-${{ github.event.inputs.target || 'site-and-staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.target == 'production-api' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/prodli-api run typecheck
      - run: pnpm --filter @workspace/prodli-api run test
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The privacy policy and terms have [placeholders] (operator name, address,
      # grievance officer, court city) until they're legally reviewed. Don't
      # publish the website while any remain; everything else still deploys.
      - name: Check the legal pages are ready to publish
        id: legal
        run: |
          if grep -nE '\[(legal name|postal address|name|city)[^]]*\]' artifacts/prodli-site/src/pages/Privacy.tsx; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Website not deployed: fill in the [placeholders] in the privacy policy / terms first (docs/legal/REVIEW-NOTES.md)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build website
        if: github.event.inputs.target != 'production-api'
        run: pnpm run build:web
      - name: Desktop downloads bucket (created once; private, served by the website's Worker)
        if: steps.creds.outputs.present == 'true' && steps.legal.outputs.ready == 'true' && github.event.inputs.target != 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          buckets="$(pnpm exec wrangler r2 bucket list)"
          case "$buckets" in *prodli-downloads*) echo "prodli-downloads exists" ;; *) pnpm exec wrangler r2 bucket create prodli-downloads ;; esac
      - name: Deploy website (prodli.com)
        if: steps.creds.outputs.present == 'true' && steps.legal.outputs.ready == 'true' && github.event.inputs.target != 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c ../prodli-site/wrangler.jsonc
      - name: Video bucket, staging (created once; shared videos, src/videos.ts)
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target != 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          buckets="$(pnpm exec wrangler r2 bucket list)"
          case "$buckets" in *prodli-videos-staging*) echo "prodli-videos-staging exists" ;; *) pnpm exec wrangler r2 bucket create prodli-videos-staging ;; esac
      - name: Deploy API (staging)
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target != 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:staging

      - name: Video bucket, production (created once; shared videos, src/videos.ts)
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target == 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Exact name: "prodli-videos-staging" must not count as "prodli-videos".
          if pnpm exec wrangler r2 bucket list | grep -Eq '(^|[[:space:]])prodli-videos([[:space:]]|$)'; then echo "prodli-videos exists"; else pnpm exec wrangler r2 bucket create prodli-videos; fi
      - name: Save a database restore point (production)
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target == 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          info="$(pnpm exec wrangler d1 time-travel info DB --env production)"
          echo "$info"
          bookmark="$(printf '%s' "$info" | grep -oE "[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}" | head -1)"
          if [ -z "$bookmark" ]; then echo "::error::Couldn't read the D1 bookmark; not deploying."; exit 1; fi
          {
            echo "### Restore point (before this deploy)"
            echo ""
            echo "Bookmark: \`$bookmark\`"
            echo ""
            echo "To undo database changes from this deploy:"
            echo '```bash'
            echo "pnpm --filter @workspace/prodli-api exec wrangler d1 time-travel restore DB --env production --bookmark=$bookmark"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy API (production)
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target == 'production-api'
        working-directory: artifacts/prodli-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:production 2>&1 | tee deploy.log

      - name: Check production is healthy
        if: steps.creds.outputs.present == 'true' && github.event.inputs.target == 'production-api'
        working-directory: artifacts/prodli-api
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://app.prodli.com/api/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 10
          done
          [ "${ok:-}" = 1 ] || { echo "::error::app.prodli.com/api/health isn't ok after the deploy."; exit 1; }
          curl -fsS -o /dev/null -w "web app %{http_code}\n" https://app.prodli.com/
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | head -1)"
          { echo ""; echo "### Deployed"; echo ""; echo "${version:-Version ID not found in the log}. Health check ok."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::Built and tested but not deployed — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/CLOUDFLARE.md)."
